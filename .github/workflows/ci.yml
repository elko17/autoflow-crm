name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autoflow
          POSTGRES_PASSWORD: autoflow_test
          POSTGRES_DB: autoflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoflow -d autoflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://autoflow:autoflow_test@localhost:5432/autoflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/001_auth.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/002_crm_data.sql
      - run: npm run lint
      - run: npm run build
